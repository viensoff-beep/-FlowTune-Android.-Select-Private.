
name: Build FlowTune APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FlowTune-Android-Updated.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip FlowTune-Android-Updated.zip -d extracted
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found in ZIP"
            exit 1
          fi
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowTune-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
